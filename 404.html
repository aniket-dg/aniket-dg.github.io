<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Page not found | Aniket Gavali</title>
<meta name="robots" content="noindex" />
<link rel="icon" href="/favicon.ico" />
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@500;600;700;800&family=Karla:wght@400;500;600&display=swap">
<style>
  :root {
    --paper: #FBF6EF;
    --paper-raised: #FFFDF8;
    --ink: #2B2620;
    --ink-soft: #6B6357;
    --ink-faint: #9B9284;
    --line: #EDE2D0;
    --line-strong: #DFCFAF;
    --accent: #2F7B6B;
    --accent-soft: #E4F1EC;
    --accent-2: #E8A33D;
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      --paper: #1C1815; --paper-raised: #242019; --ink: #F3EDE3; --ink-soft: #C9BFAE;
      --ink-faint: #8B8172; --line: #3A332A; --line-strong: #4A4133;
      --accent: #5FBBA4; --accent-soft: #1E3831; --accent-2: #F0B85C;
    }
  }
  :root[data-theme="dark"] {
    --paper: #1C1815; --paper-raised: #242019; --ink: #F3EDE3; --ink-soft: #C9BFAE;
    --ink-faint: #8B8172; --line: #3A332A; --line-strong: #4A4133;
    --accent: #5FBBA4; --accent-soft: #1E3831; --accent-2: #F0B85C;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0; min-height: 100vh; display: flex; align-items: center;
    background: var(--paper); color: var(--ink);
    font-family: 'Karla', system-ui, sans-serif;
  }
  .wrap { max-width: 520px; margin: 0 auto; padding: 24px; text-align: left; }
  .blob {
    width: 88px; height: 88px;
    background: linear-gradient(155deg, var(--accent-2), var(--accent));
    border-radius: 42% 58% 63% 37% / 41% 44% 56% 59%;
    display: flex; align-items: center; justify-content: center;
    font-family: 'Plus Jakarta Sans', sans-serif; font-weight: 800; font-size: 15px; color: var(--paper-raised);
    margin-bottom: 28px;
  }
  h1 { font-family: 'Plus Jakarta Sans', sans-serif; font-weight: 800; font-size: clamp(26px, 4vw, 34px); margin: 0 0 12px; }
  p { color: var(--ink-soft); font-size: 16px; line-height: 1.6; margin: 0 0 28px; max-width: 46ch; }
  p code { font-family: monospace; background: var(--paper-raised); border: 1px solid var(--line); border-radius: 4px; padding: 1px 6px; }
  .btn {
    font-family: 'Plus Jakarta Sans', sans-serif; font-weight: 700; font-size: 14.5px;
    padding: 12px 22px; border-radius: 28px; text-decoration: none; display: inline-flex;
    align-items: center; gap: 6px; background: var(--accent); color: var(--paper-raised);
  }
  .btn:hover { background: color-mix(in srgb, var(--accent) 85%, black); }
</style>
</head>
<body>
  <div class="wrap">
    <div class="blob">404</div>
    <h1>That page doesn't exist.</h1>
    <p>Whatever you were looking for isn't here — the link might be old, or mistyped. Let's get you back to somewhere real.</p>
    <a class="btn" href="/">← Back to the homepage</a>
  </div>
</body>
</html>
